name: FileConverter
options:
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  xcodeVersion: "27.0"
packages:
  FileConverterPackage:
    path: .
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: VU98S4HN9K
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 1.0.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ARCHS: arm64 x86_64
      ONLY_ACTIVE_ARCH: NO
targets:
  FileConverterNative:
    type: application
    platform: macOS
    sources:
      - path: Sources/FileConverterApp
        excludes:
          - Info.plist
          - Resources
          - "*.entitlements"
          - Settings/ExternalToolsSettingsView.swift
    resources:
      - path: Sources/FileConverterApp/Resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/FileConverterApp/FileConverterNative.entitlements
        FILE_CONVERTER_APP_BUNDLE_ID: io.fileconverter.app
        FILE_CONVERTER_APP_GROUP: group.io.fileconverter.shared
        FILE_CONVERTER_EDITION: native
        FILE_CONVERTER_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)io.fileconverter.ipc
        FILE_CONVERTER_URL_SCHEME: fileconverter
        INFOPLIST_FILE: Sources/FileConverterApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.fileconverter.app
        PRODUCT_NAME: File Converter
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/FileConverterApp/FileConverterNativeDebug.entitlements
          FILE_CONVERTER_LOCAL_IPC_PATH: /Library/Application Support/FileConverter/LocalIPC/native/
    dependencies:
      - package: FileConverterPackage
        product: FileConverterCore
      - package: FileConverterPackage
        product: FileConverterContracts
      - package: FileConverterPackage
        product: FileConverterNativeBackends
      - target: FileConverterNativeFinderExtension
        embed: true
  FileConverterNativeFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FileConverterFinderSync
        excludes:
          - Info.plist
          - main.swift
          - "*.entitlements"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/FileConverterFinderSync/FileConverterNativeFinder.entitlements
        FILE_CONVERTER_APP_BUNDLE_ID: io.fileconverter.app
        FILE_CONVERTER_APP_GROUP: group.io.fileconverter.shared
        FILE_CONVERTER_EDITION: native
        FILE_CONVERTER_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)io.fileconverter.ipc
        FILE_CONVERTER_URL_SCHEME: fileconverter
        INFOPLIST_FILE: Sources/FileConverterFinderSync/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.fileconverter.app.findersync
        PRODUCT_NAME: FileConverterNativeFinderExtension
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/FileConverterFinderSync/FileConverterNativeFinderDebug.entitlements
          FILE_CONVERTER_LOCAL_IPC_PATH: /Library/Application Support/FileConverter/LocalIPC/native/
    dependencies:
      - package: FileConverterPackage
        product: FileConverterContracts
      - package: FileConverterPackage
        product: FileConverterFinderSupport
  FileConverterExtended:
    type: application
    platform: macOS
    sources:
      - path: Sources/FileConverterApp
        excludes:
          - Info.plist
          - Resources
          - "*.entitlements"
    resources:
      - path: Sources/FileConverterApp/Resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/FileConverterApp/FileConverterExtended.entitlements
        FILE_CONVERTER_APP_BUNDLE_ID: io.fileconverter.app.extended
        FILE_CONVERTER_APP_GROUP: group.io.fileconverter.extended.shared
        FILE_CONVERTER_EDITION: extended
        FILE_CONVERTER_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)io.fileconverter.extended.ipc
        FILE_CONVERTER_URL_SCHEME: fileconverter-extended
        INFOPLIST_FILE: Sources/FileConverterApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.fileconverter.app.extended
        PRODUCT_NAME: File Converter Extended
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FILE_CONVERTER_EXTENDED
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/FileConverterApp/FileConverterExtendedDebug.entitlements
          FILE_CONVERTER_LOCAL_IPC_PATH: /Library/Application Support/FileConverter/LocalIPC/extended/
    dependencies:
      - package: FileConverterPackage
        product: FileConverterCore
      - package: FileConverterPackage
        product: FileConverterContracts
      - package: FileConverterPackage
        product: FileConverterNativeBackends
      - package: FileConverterPackage
        product: FileConverterExternalBackends
      - target: FileConverterExtendedFinderExtension
        embed: true
  FileConverterExtendedFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FileConverterFinderSync
        excludes:
          - Info.plist
          - main.swift
          - "*.entitlements"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/FileConverterFinderSync/FileConverterExtendedFinder.entitlements
        FILE_CONVERTER_APP_BUNDLE_ID: io.fileconverter.app.extended
        FILE_CONVERTER_APP_GROUP: group.io.fileconverter.extended.shared
        FILE_CONVERTER_EDITION: extended
        FILE_CONVERTER_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)io.fileconverter.extended.ipc
        FILE_CONVERTER_URL_SCHEME: fileconverter-extended
        INFOPLIST_FILE: Sources/FileConverterFinderSync/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.fileconverter.app.extended.findersync
        PRODUCT_NAME: FileConverterExtendedFinderExtension
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/FileConverterFinderSync/FileConverterExtendedFinderDebug.entitlements
          FILE_CONVERTER_LOCAL_IPC_PATH: /Library/Application Support/FileConverter/LocalIPC/extended/
    dependencies:
      - package: FileConverterPackage
        product: FileConverterFinderSupport
      - package: FileConverterPackage
        product: FileConverterContracts
schemes:
  FileConverterNative:
    build:
      targets:
        FileConverterNative: all
        FileConverterNativeFinderExtension: all
    run:
      config: Debug
    archive:
      config: Release
  FileConverterExtended:
    build:
      targets:
        FileConverterExtended: all
        FileConverterExtendedFinderExtension: all
    run:
      config: Debug
    archive:
      config: Release
