name: FileConverter
options:
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  xcodeVersion: "27.0"
packages:
  FileConverterPackage:
    path: .
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: VU98S4HN9K
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 1.0.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ARCHS: arm64 x86_64
      ONLY_ACTIVE_ARCH: NO
targets:
  FileConverter:
    type: application
    platform: macOS
    sources:
      - path: Sources/FileConverterApp
        excludes:
          - Info.plist
          - Resources
          - "*.entitlements"
      - path: Sources/FileConverterApp/Resources
        excludes:
          - "*.svg"
          - "*.icns"
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/FileConverterApp/FileConverter.entitlements
        FILE_CONVERTER_APP_BUNDLE_ID: io.fileconverter.app
        FILE_CONVERTER_APP_GROUP: group.io.fileconverter.shared
        FILE_CONVERTER_EDITION: native
        FILE_CONVERTER_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)io.fileconverter.ipc
        FILE_CONVERTER_LOCAL_IPC_PATH: /Library/Application Support/FileConverter/LocalIPC/native/
        FILE_CONVERTER_URL_SCHEME: fileconverter
        INFOPLIST_FILE: Sources/FileConverterApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.fileconverter.app
        PRODUCT_NAME: File Converter
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/FileConverterApp/FileConverterDebug.entitlements
    dependencies:
      - package: FileConverterPackage
        product: FileConverterCore
      - package: FileConverterPackage
        product: FileConverterContracts
      - package: FileConverterPackage
        product: FileConverterNativeBackends
      - package: FileConverterPackage
        product: FileConverterExternalBackends
      - package: FileConverterPackage
        product: FileConverterFinderSupport
      - target: FileConverterFinderExtension
        embed: true
  FileConverterFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FileConverterFinderSync
        excludes:
          - Info.plist
          - main.swift
          - "*.entitlements"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/FileConverterFinderSync/FileConverterFinder.entitlements
        FILE_CONVERTER_APP_BUNDLE_ID: io.fileconverter.app
        FILE_CONVERTER_APP_GROUP: group.io.fileconverter.shared
        FILE_CONVERTER_EDITION: native
        FILE_CONVERTER_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)io.fileconverter.ipc
        FILE_CONVERTER_LOCAL_IPC_PATH: /Library/Application Support/FileConverter/LocalIPC/native/
        FILE_CONVERTER_URL_SCHEME: fileconverter
        INFOPLIST_FILE: Sources/FileConverterFinderSync/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.fileconverter.app.findersync
        PRODUCT_NAME: FileConverterFinderExtension
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/FileConverterFinderSync/FileConverterFinderDebug.entitlements
    dependencies:
      - package: FileConverterPackage
        product: FileConverterContracts
      - package: FileConverterPackage
        product: FileConverterFinderSupport
  FileConverterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FileConverterTests
    dependencies:
      - package: FileConverterPackage
        product: FileConverterCore
      - package: FileConverterPackage
        product: FileConverterContracts
      - package: FileConverterPackage
        product: FileConverterNativeBackends
      - package: FileConverterPackage
        product: FileConverterExternalBackends
  FileConverterFinderSupportTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FileConverterFinderSupportTests
    dependencies:
      - package: FileConverterPackage
        product: FileConverterContracts
      - package: FileConverterPackage
        product: FileConverterFinderSupport
schemes:
  FileConverter:
    build:
      targets:
        FileConverter: all
        FileConverterFinderExtension: all
    test:
      targets:
        - FileConverterTests
        - FileConverterFinderSupportTests
    run:
      config: Debug
    archive:
      config: Release
