<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>File Converter — macOS App Icon</title>
<desc>Two files with a circular conversion arrow on a macOS squircle.</desc>
<defs>
  <!-- Squircle background -->
  <linearGradient id="bg" x1="12%" y1="8%" x2="88%" y2="92%">
    <stop offset="0%" stop-color="#1E242F"/>
    <stop offset="52%" stop-color="#13171D"/>
    <stop offset="100%" stop-color="#0A0C0F"/>
  </linearGradient>
  <!-- Subtle top highlight for liquid-glass feel -->
  <radialGradient id="hl" cx="50%" cy="10%" r="78%">
    <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
    <stop offset="38%" stop-color="white" stop-opacity="0.06"/>
    <stop offset="72%" stop-color="white" stop-opacity="0"/>
  </radialGradient>
  <!-- Accent for arrows / front file -->
  <linearGradient id="accentA" x1="0%" y1="50%" x2="100%" y2="50%">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#0EA5E9"/>
  </linearGradient>
  <linearGradient id="accentB" x1="0%" y1="50%" x2="100%" y2="50%">
    <stop offset="0%" stop-color="#A5B4FC"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="fileFrontFill" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F8FAFC"/>
    <stop offset="100%" stop-color="#E2E8F0"/>
  </linearGradient>
  <!-- Soft drop shadow -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000" flood-opacity="0.55"/>
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <filter id="fileShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
  </filter>
  <!-- Inner stroke for files -->
  <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#CBD5E1"/>
    <stop offset="100%" stop-color="#94A3B8"/>
  </linearGradient>
</defs>

<!-- Squircle -->
<rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
<rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#hl)"/>
<!-- Subtle edge stroke like macOS icons -->
<rect x="0.5" y="0.5" width="1023" height="1023" rx="227.5" fill="none" stroke="white" stroke-opacity="0.09" stroke-width="1.2"/>

<!-- ============ BACK FILE (source) — muted, behind ============ -->
<g filter="url(#fileShadow)" transform="translate(188 272) rotate(-7.2)">
  <!-- File body with folded corner -->
  <path d="M 18 0 H 212 L 298 86 V 358 C 298 371 287 382 274 382 H 18 C 5 382 -6 371 -6 358 V 13 C -6 0 5 -13 18 -13 Z" fill="#242A35" stroke="#3A4252" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Fold triangle -->
  <path d="M 212 0 L 298 86 L 212 86 Z" fill="#2E3646" stroke="#3A4252" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 212 86 L 298 86 L 212 0" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1.5"/>
  <!-- File lines (hint image/video) -->
  <rect x="34" y="138" width="194" height="10" rx="5" fill="white" opacity="0.08"/>
  <rect x="34" y="168" width="144" height="10" rx="5" fill="white" opacity="0.06"/>
  <rect x="34" y="198" width="172" height="10" rx="5" fill="white" opacity="0.05"/>
  <!-- Small media badge inside back file -->
  <g transform="translate(34 242)">
    <rect width="84" height="64" rx="12" fill="#1A1F2A" stroke="white" stroke-opacity="0.07"/>
    <path d="M 32 18 L 56 32 L 32 46 Z" fill="white" opacity="0.26"/>
  </g>
</g>

<!-- ============ FRONT FILE (destination) — bright, crisp ============ -->
<g filter="url(#fileShadow)" transform="translate(492 248) rotate(5.4)">
  <path d="M 20 0 H 228 L 324 96 V 376 C 324 392 311 405 295 405 H 20 C 4 405 -9 392 -9 376 V 16 C -9 0 4 -16 20 -16 Z" fill="url(#fileFrontFill)" stroke="white" stroke-opacity="0.9" stroke-width="1.6"/>
  <!-- Fold triangle — paper fold highlight -->
  <path d="M 228 0 L 324 96 L 228 96 Z" fill="url(#fold)"/>
  <path d="M 228 96 L 324 96 L 228 0" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="1"/>
  <!-- Thin inner border for definition -->
  <path d="M 20 0 H 228 L 324 96 V 376 C 324 386 316 394 306 394 H 20 C 9 394 -2 386 -2 376 V 11 C -2 3 7 -5 15 -5 Z" fill="none" stroke="#0F172A" stroke-opacity="0.07" stroke-width="1.2"/>
  <!-- Destination file content — image hint -->
  <g transform="translate(42 150)">
    <rect width="210" height="126" rx="16" fill="#0F172A" fill-opacity="0.045" stroke="#0F172A" stroke-opacity="0.07"/>
    <!-- Mountain / image icon -->
    <path d="M 22 92 L 58 56 L 84 78 L 108 48 L 168 98 L 22 98 Z" fill="#0EA5E9" opacity="0.15"/>
    <path d="M 22 92 L 58 56 L 84 78 L 108 48 L 168 98" fill="none" stroke="#0EA5E9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="46" cy="38" r="18" fill="none" stroke="#0EA5E9" stroke-width="3.2" opacity="0.9"/>
    <circle cx="46" cy="38" r="5.5" fill="#0EA5E9" opacity="0.95"/>
  </g>
  <!-- Format label stripe at bottom -->
  <g transform="translate(42 304)">
    <rect width="210" height="38" rx="12" fill="#0F172A" opacity="0.045"/>
    <rect x="14" y="10" width="84" height="18" rx="9" fill="#0EA5E9" opacity="0.14"/>
    <rect x="14" y="10" width="84" height="18" rx="9" fill="none" stroke="#0EA5E9" stroke-opacity="0.22"/>
  </g>
</g>

<!-- ============ CONVERSION ORBIT — two thick rounded arrows forming a circle ============ -->
<g filter="url(#shadow)">
  <!-- Track circle (subtle) -->
  <circle cx="512" cy="524" r="170" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="3 10" stroke-linecap="round"/>
  <!-- Top arrow (cyan → blue) -->
  <path d="M 352 500 C 352 405, 425 340, 512 340 C 599 340, 672 405, 672 500"
        fill="none" stroke="url(#accentA)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"/>
  <!-- Bottom arrow (lavender → cyan) -->
  <path d="M 672 548 C 672 643, 599 708, 512 708 C 425 708, 352 643, 352 548"
        fill="none" stroke="url(#accentB)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"/>
  <!-- Arrow heads — crisp triangles -->
  <!-- Head on top arc (right end, pointing down-right along tangent) -->
  <g transform="translate(672 500) rotate(2)">
    <path d="M -22 -26 L 26 0 L -22 26 Z" fill="#0EA5E9" stroke="white" stroke-opacity="0.22" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M -10 -12 L 14 0 L -10 12" fill="none" stroke="white" stroke-opacity="0.9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Head on bottom arc (left end, pointing up-left) -->
  <g transform="translate(352 548) rotate(182)">
    <path d="M -22 -26 L 26 0 L -22 26 Z" fill="#38BDF8" stroke="white" stroke-opacity="0.22" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M -10 -12 L 14 0 L -10 12" fill="none" stroke="white" stroke-opacity="0.9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>

<!-- Center conversion badge — solid disc with bidirectional icon -->
<g>
  <circle cx="512" cy="524" r="62" fill="white" stroke="white" stroke-opacity="0.9" stroke-width="1.2" filter="url(#fileShadow)"/>
  <circle cx="512" cy="524" r="61" fill="white"/>
  <!-- Subtle inner ring -->
  <circle cx="512" cy="524" r="61" fill="none" stroke="#0F172A" stroke-opacity="0.06" stroke-width="1.4"/>
  <!-- Bidirectional arrows icon -->
  <g stroke="#0F172A" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.88">
    <!-- Top arrow right -->
    <path d="M 476 508 H 540"/>
    <path d="M 526 494 L 540 508 L 526 522"/>
    <!-- Bottom arrow left -->
    <path d="M 548 540 H 484"/>
    <path d="M 498 526 L 484 540 L 498 554"/>
  </g>
  <!-- Small dot in center -->
  <circle cx="512" cy="524" r="5.5" fill="#0EA5E9"/>
</g>

<!-- Tiny gloss dot top-left (Apple polish) -->
<circle cx="312" cy="198" r="3.2" fill="white" opacity="0.55"/>
<circle cx="318" cy="212" r="1.6" fill="white" opacity="0.28"/>

</svg>
