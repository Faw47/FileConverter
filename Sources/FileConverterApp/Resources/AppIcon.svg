<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">File Converter</title>
  <desc id="desc">Two document shapes connected by a circular conversion arrow.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343A45"/>
      <stop offset="0.52" stop-color="#1C2028"/>
      <stop offset="1" stop-color="#0D0F14"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8DCE3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dy="8" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="40" y="40" width="944" height="944" rx="220" fill="url(#surface)"/>
  <rect x="40" y="40" width="944" height="944" rx="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>

  <g filter="url(#shadow)" fill="url(#paper)">
    <path d="M208 198h184l124 124v300c0 30-24 54-54 54H208c-30 0-54-24-54-54V252c0-30 24-54 54-54Z"/>
    <path d="M392 198v96c0 16 13 28 28 28h96Z" fill="#C9CED7"/>
    <path d="M532 510h184l124 124v182c0 30-24 54-54 54H532c-30 0-54-24-54-54V564c0-30 24-54 54-54Z"/>
    <path d="M716 510v96c0 16 13 28 28 28h96Z" fill="#C9CED7"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M612 302h92c48 0 86 38 86 86v70"/>
    <path d="m746 426 44 44 44-44"/>
    <path d="M412 722h-92c-48 0-86-38-86-86v-70"/>
    <path d="m278 598-44-44-44 44"/>
  </g>
</svg>
